name: D07 AUDIT CORE

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'src/lib/audit-core/**'
      - 'src/lib/__tests__/d07AuditCore.test.ts'
      - 'docs/audit-core/D07_*'
      - 'docs/historia/plan-odbioru-d07-*'
      - '.github/workflows/d07-audit-core.yml'

jobs:
  audit-core-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Type Check and Lint
        run: npm run lint

      - name: D07 Mathematical Invariants
        run: npx vitest run src/lib/__tests__/d07AuditCore.test.ts

      - name: Full Unit Test Suite
        run: npm test

      - name: Build Client and Server
        run: npm run build
