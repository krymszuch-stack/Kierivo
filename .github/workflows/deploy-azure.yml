name: Deploy Kierivo to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and test
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Setup Python for Dual-Layer PDF engine
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -e mastervault-cv

      - run: npm ci

      - name: Install semantic work graph dependencies
        working-directory: labs/semantic-work-graph
        run: npm ci

      - run: npm run lint

      - run: npm test

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry "${{ vars.AZURE_ACR_NAME }}" \
            --image "${{ vars.AZURE_CONTAINER_APP }}:${{ github.sha }}" \
            --file Dockerfile \
            --build-arg "VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}" \
            --build-arg "VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}" \
            --build-arg "VITE_API_URL=" \
            .

      - name: Deploy new revision
        run: |
          IMAGE="${{ vars.AZURE_ACR_LOGIN_SERVER }}/${{ vars.AZURE_CONTAINER_APP }}:${{ github.sha }}"

          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "$IMAGE"

          # APP_URL musi wskazywać na publiczny FQDN — bez tego OAuth i callbacki
          # ze Stripe'a lecą w kosmos (placeholder.invalid z pierwszego deployu).
          # Pobieramy FQDN z Container App i nadpisujemy zmienną środowiskową.
          FQDN=$(az containerapp show \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn \
            -o tsv)

          APP_URL="https://${FQDN}"
          echo "Setting APP_URL=${APP_URL}"

          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --set-env-vars "APP_URL=${APP_URL}"

      - name: Health check
        run: |
          FQDN=$(az containerapp show \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn \
            -o tsv)

          echo "Checking https://${FQDN}/api/health"

          curl \
            --fail \
            --retry 12 \
            --retry-delay 5 \
            "https://${FQDN}/api/health"
