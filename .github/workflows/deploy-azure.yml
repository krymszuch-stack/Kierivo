name: Deploy Kierivo to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build image in ACR
        run: |
          az acr build \
            --registry ca41879ca90bacr \
            --image kierivo:${{ github.sha }} \
            --file Dockerfile \
            --build-arg VITE_SUPABASE_URL="${{ vars.VITE_SUPABASE_URL }}" \
            --build-arg VITE_SUPABASE_ANON_KEY="${{ vars.VITE_SUPABASE_ANON_KEY }}" \
            --build-arg VITE_API_URL="" \
            .

      - name: Deploy new revision
        run: |
          az containerapp update \
            --name kierivo \
            --resource-group kierivo-prod-rg \
            --image ca41879ca90bacr.azurecr.io/kierivo:${{ github.sha }}

      - name: Health check
        run: |
          FQDN=$(az containerapp show \
            --name kierivo \
            --resource-group kierivo-prod-rg \
            --query properties.configuration.ingress.fqdn \
            -o tsv)

          curl --fail --retry 12 --retry-delay 5 \
            "https://${FQDN}/api/health"
