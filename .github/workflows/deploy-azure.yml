name: Deploy Kierivo to Azure

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release-gate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release-gate.yml
    permissions:
      contents: read
  deploy:
    needs: release-gate
    if: github.ref == 'refs/heads/main' && needs.release-gate.result == 'success'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wymagane dedykowane konto smoke przed jakąkolwiek zmianą Azure
        env:
          SMOKE_STATE_JSON: ${{ secrets.RELEASE_SMOKE_STORAGE_STATE }}
        run: |
          test -n "$SMOKE_STATE_JSON" || { echo 'UNKNOWN: brak sesji dedykowanego konta smoke. Wdrożenie zablokowane.'; exit 1; }
          node --input-type=module -e 'const s=JSON.parse(process.env.SMOKE_STATE_JSON); if (!Array.isArray(s.origins) || !s.origins.some(o => o.localStorage?.some(k => k.name.endsWith("-auth-token")))) process.exit(1)'
      - name: Bramka produkcyjnych zgłoszeń — odczyt wymagany
        env:
          BACKEND_MODE: cloud
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run bledy:bramka -- --required --cloud
      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry "${{ vars.AZURE_ACR_NAME }}" \
            --image "${{ vars.AZURE_CONTAINER_APP }}:${{ github.sha }}" \
            --file Dockerfile \
            --build-arg "VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}" \
            --build-arg "VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}" \
            --build-arg "VITE_API_URL=" \
            .

      - name: Deploy new revision
        run: |
          IMAGE="${{ vars.AZURE_ACR_LOGIN_SERVER }}/${{ vars.AZURE_CONTAINER_APP }}:${{ github.sha }}"

          FQDN=$(az containerapp show \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn \
            -o tsv)

          APP_URL="https://${FQDN}"
          echo "Setting APP_URL=${APP_URL} before activating the new image"

          # Ustawienie callbacków przed zmianą obrazu eliminuje rewizję z
          # placeholderem. Kolejna rewizja dziedziczy już finalny adres.
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --set-env-vars "APP_URL=${APP_URL}"

          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "$IMAGE"

      - name: Health check
        run: |
          FQDN=$(az containerapp show \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn \
            -o tsv)

          echo "Checking https://${FQDN}/api/health"

          curl \
            --fail \
            --retry 12 \
            --retry-delay 5 \
            "https://${FQDN}/api/health"

      - name: Rzeczywisty smoke po wdrożeniu — CV → audyt → pobrany PDF
        shell: bash
        env:
          SMOKE_STATE_JSON: ${{ secrets.RELEASE_SMOKE_STORAGE_STATE }}
        run: |
          SMOKE_STORAGE_STATE=$(mktemp)
          export SMOKE_STORAGE_STATE
          trap 'rm -f "$SMOKE_STORAGE_STATE"' EXIT
          chmod 600 "$SMOKE_STORAGE_STATE"
          printf '%s' "$SMOKE_STATE_JSON" > "$SMOKE_STORAGE_STATE"
          unset SMOKE_STATE_JSON
          FQDN=$(az containerapp show --name "${{ vars.AZURE_CONTAINER_APP }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query properties.configuration.ingress.fqdn -o tsv)
          BASE_URL="https://${FQDN}" npm run gate:postdeploy
      - name: Zapis dowodów po wdrożeniu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postdeploy-${{ github.sha }}
          path: artifacts/postdeploy-*/
          retention-days: 30
