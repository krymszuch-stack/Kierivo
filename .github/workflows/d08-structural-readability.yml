name: D08 STRUCTURAL READABILITY

on:
  pull_request:
    branches: [d07-audit-contract, main]
    paths:
      - 'src/lib/audit-core/**'
      - 'src/lib/__tests__/d08*.test.ts'
      - 'docs/audit-core/D08_*'
      - 'docs/historia/plan-odbioru-d08-*'
      - '.github/workflows/d08-structural-readability.yml'

jobs:
  d08-audit-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Type Check and Lint
        run: npm run lint

      - name: D08 Focused Tests
        run: npx vitest run src/lib/__tests__/d08StructuralReadability.test.ts src/lib/__tests__/d08Extractor.test.ts

      - name: Full Unit Test Suite
        run: npm test

      - name: Build Client and Server
        run: npm run build
