name: D11 SKILL RECENCY

on:
  pull_request:
    branches: [d10-formal-requirements, main]
    paths:
      - 'src/lib/audit-core/d11/**'
      - 'src/lib/__tests__/d11*.test.ts'
      - '.github/workflows/d11-skill-recency.yml'
  push:
    branches: [d11-skill-recency]
    paths:
      - 'src/lib/audit-core/d11/**'
      - 'src/lib/__tests__/d11*.test.ts'
      - '.github/workflows/d11-skill-recency.yml'

jobs:
  skill-recency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Type Check and Lint
        run: npm run lint

      - name: D11 Focused Tests
        run: npx vitest run src/lib/__tests__/d11*.test.ts

      - name: Audit Core Regression Tests
        run: npx vitest run src/lib/__tests__/d08*.test.ts src/lib/__tests__/d09*.test.ts src/lib/__tests__/d10*.test.ts src/lib/__tests__/d20AdaptiveLearning.test.ts

      - name: Full Unit Test Suite
        run: npm test

      - name: Build Client and Server
        run: npm run build
