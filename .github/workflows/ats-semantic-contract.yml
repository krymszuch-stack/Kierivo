name: ATS SEMANTIC CONTRACT

on:
  pull_request:
    branches: [d11-skill-recency, main]
    paths:
      - 'src/lib/atsSimulator.ts'
      - 'src/lib/atsScorer.ts'
      - 'src/lib/__tests__/atsSemanticContract.test.ts'
      - '.github/workflows/ats-semantic-contract.yml'
  push:
    branches: [test/ats-semantic-contract]
    paths:
      - 'src/lib/atsSimulator.ts'
      - 'src/lib/atsScorer.ts'
      - 'src/lib/__tests__/atsSemanticContract.test.ts'
      - '.github/workflows/ats-semantic-contract.yml'

jobs:
  semantic-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Type Check and Lint
        run: npm run lint

      - name: ATS Semantic Contract
        id: semantic_contract
        continue-on-error: true
        run: npx vitest run src/lib/__tests__/atsSemanticContract.test.ts

      - name: Full Unit Test Suite
        id: full_suite
        continue-on-error: true
        run: npm test

      - name: Build Client and Server
        run: npm run build

      - name: Fail if semantic contract or full suite failed
        if: always()
        run: |
          if [ "${{ steps.semantic_contract.outcome }}" != "success" ] || [ "${{ steps.full_suite.outcome }}" != "success" ]; then
            echo "ATS semantic contract lub pełny test suite wykrył regresję/rozjazd."
            exit 1
          fi
