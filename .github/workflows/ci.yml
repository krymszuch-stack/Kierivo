name: Kierivo CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Fast Gate — krytyczne regresje i zmienione moduły
        env:
          GATE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run gate:fast
      - name: Zapis dowodów Fast Gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-gate-${{ github.sha }}
          path: artifacts/fast-*/
          retention-days: 14
      - name: Produkcyjny smoke test — główna ścieżka (Azure OpenAI)
        env:
          NODE_ENV: production
          AI_PROVIDER: azure_openai
          AZURE_OPENAI_ENDPOINT: https://ci-smoke.openai.azure.com
          AZURE_OPENAI_DEPLOYMENT: gpt-4o
          BACKEND_MODE: cloud
          APP_URL: https://app.kierivo.com
          SUPABASE_URL: https://ci-smoke.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-smoke-service-role-key
          PORT: 8099
        run: |
          npm start &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 20); do curl -sf -m 2 http://localhost:8099/api/health && break || sleep 1; done
          curl -sf -m 5 http://localhost:8099/api/health | grep -q '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://localhost:8099/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://localhost:8099/api/me)" = "401"
      - name: Smoke test trybu offline — degradacja bez internetu (Ollama)
        env:
          NODE_ENV: development
          AI_PROVIDER: ollama
          BACKEND_MODE: local
          PORT: 8098
        run: |
          npm start &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 20); do curl -sf -m 2 http://localhost:8098/api/health && break || sleep 1; done
          curl -sf -m 5 http://localhost:8098/api/health | grep -q '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://localhost:8098/api/me)" = "501"
      - name: Sekrety nie trafiają do przeglądarki
        run: |
          ! grep -rE "service_role|sk_live_|sk_test_|SUPABASE_SERVICE_ROLE|AZURE_OPENAI" dist/client/
      - run: docker build -t kierivo-api:ci .
      # Testy na runnerze mogą korzystać z fontów hosta. Sprawdzamy sam obraz
      # runtime jako użytkownik node, aby brak fontów nie wrócił dopiero na Azure.
      - name: PDF z produkcyjnego obrazu — fonty i rzeczywisty dokument
        run: |
          docker run --rm --entrypoint sh kierivo-api:ci -c '
            cd /app/mastervault-cv &&
            python -m mvcv export sample/mastervault.json -o /tmp/kierivo-runtime.pdf --layout single --theme parchment --avatar none --target-pages 2 &&
            python -m mvcv verify /tmp/kierivo-runtime.pdf
          '
