name: Kierivo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: node scripts/sprawdz-limity-regul.mjs
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Produkcyjny smoke test bez zewnętrznego AI
        env:
          NODE_ENV: production
          AI_PROVIDER: ollama
          PORT: 8099
        run: |
          npm start &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 20); do curl -sf -m 2 http://localhost:8099/api/health && break || sleep 1; done
          curl -sf -m 5 http://localhost:8099/api/health | grep -q '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://localhost:8099/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://localhost:8099/api/me)" = "501"
      - name: Sekrety nie trafiają do przeglądarki
        run: |
          ! grep -rE "service_role|sk_live_|sk_test_|SUPABASE_SERVICE_ROLE|AZURE_OPENAI" dist/client/
      - run: docker build -t kierivo-api:ci .
