<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="fav-title">
  <title id="fav-title">Kierivo</title>
  <!--
    Favicon Kierivo — nowe logo (wdrożone 2026-09-18).
    Tło: okrąg granatowy #1E3A8A.
    Sygnet KK: chevron tył biały z przezroczystością, chevron przód biały.
    Optymalizowany pod 16, 24 i 32 px.
  -->
  <rect width="64" height="64" rx="14" fill="#1E3A8A"/>

  <!-- Chevron tył (lewa strzałka, bladoniebieski) -->
  <path
    fill="#A8BFFF"
    d="M 27 14 L 14 32 L 27 50 L 34 50 L 21 32 L 34 14 Z"
  />

  <!-- Chevron przód (prawa strzałka, biały) -->
  <path
    fill="#FFFFFF"
    d="M 38 14 L 25 32 L 38 50 L 45 50 L 32 32 L 45 14 Z"
  />
</svg>
