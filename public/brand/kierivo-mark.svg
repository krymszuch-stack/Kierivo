<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-labelledby="title desc">
  <title id="title">Sygnet Kierivo</title>
  <desc id="desc">Podwójne K jako strzałki chevron — granatowe i niebieskie.</desc>
  <!--
    Nowe logo Kierivo (wdrożone 2026-09-18).
    Dwa chevrony K ułożone jeden za drugim — metafora kierunku i ruchu.
    Kolory: #1E3A8A (granat), #6B8AE8 (niebieskawa poświata).
    Rozmiar sygnetu: 80×80 px.
  -->

  <!-- Pierwszy chevron K (z tyłu, jaśniejszy — niebieskawa poświata) -->
  <path
    fill="#6B8AE8"
    d="
      M 28 18
      L 16 40
      L 28 62
      L 38 62
      L 26 40
      L 38 18
      Z
    "
  />

  <!-- Drugi chevron K (z przodu, główny — granatowy) -->
  <path
    fill="#1E3A8A"
    d="
      M 44 18
      L 32 40
      L 44 62
      L 54 62
      L 42 40
      L 54 18
      Z
    "
  />
</svg>
