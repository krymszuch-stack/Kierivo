<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" role="img" aria-labelledby="kld-title">
  <title id="kld-title">Kierivo — wersja na ciemne tło</title>
  <!--
    Nowe logo Kierivo — wersja na ciemne tło.
    Chevrony: biały (#FFFFFF) i bladoniebieski (#A8BFFF).
    Tekst: biały.
  -->

  <!-- Sygnet: chevron tył (bladoniebieski) -->
  <path
    fill="#A8BFFF"
    d="M 28 10 L 10 40 L 28 70 L 40 70 L 22 40 L 40 10 Z"
  />

  <!-- Sygnet: chevron przód (biały) -->
  <path
    fill="#FFFFFF"
    d="M 48 10 L 30 40 L 48 70 L 60 70 L 42 40 L 60 10 Z"
  />

  <!-- Napis Kierivo na ciemne tło -->
  <text
    x="80"
    y="55"
    fill="#FFFFFF"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="44"
    font-weight="700"
    letter-spacing="-1.5"
  >Kierivo</text>
</svg>
