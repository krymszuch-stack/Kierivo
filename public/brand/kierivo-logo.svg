<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" role="img" aria-labelledby="kl-title kl-desc">
  <title id="kl-title">Kierivo</title>
  <desc id="kl-desc">Logo Kierivo — podwójne K jako chevrony oraz napis Kierivo.</desc>
  <!--
    Nowe logo Kierivo — wersja pozioma (sygnet + napis).
    Wdrożone 2026-09-18.
    Sygnet: podwójne chevrony K w granacie (#1E3A8A) i niebieskiej poświacie (#6B8AE8).
    Tekst: granatowy #0C1828, krój bezszeryfowy, bold.
  -->

  <!-- Sygnet: chevron tył (jaśniejszy, niebieski) -->
  <path
    fill="#6B8AE8"
    d="M 28 10 L 10 40 L 28 70 L 40 70 L 22 40 L 40 10 Z"
  />

  <!-- Sygnet: chevron przód (główny, granatowy) -->
  <path
    fill="#1E3A8A"
    d="M 48 10 L 30 40 L 48 70 L 60 70 L 42 40 L 60 10 Z"
  />

  <!-- Napis Kierivo -->
  <text
    x="80"
    y="55"
    fill="#0C1828"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="44"
    font-weight="700"
    letter-spacing="-1.5"
  >Kierivo</text>
</svg>
