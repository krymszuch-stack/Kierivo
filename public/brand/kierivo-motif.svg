<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="motif-title">
  <title id="motif-title">Motyw graficzny Kierivo</title>
  <!--
    Motyw tła — powtarzające się chevrony KK w bardzo niskim kryciu.
    Zaktualizowany do nowego logo 2026-09-18.
  -->
  <defs>
    <pattern id="motif" width="200" height="200" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
      <!-- Chevron tył -->
      <path fill="#155EEF" fill-opacity=".06"
        d="M 50 30 L 30 70 L 50 110 L 64 110 L 44 70 L 64 30 Z"
      />
      <!-- Chevron przód -->
      <path fill="#1E3A8A" fill-opacity=".10"
        d="M 72 30 L 52 70 L 72 110 L 86 110 L 66 70 L 86 30 Z"
      />
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="#F7FAFF"/>
  <rect width="1200" height="600" fill="url(#motif)"/>
</svg>
