<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" role="img" aria-labelledby="klf-title">
  <title id="klf-title">Kierivo — wersja płaska</title>
  <!--
    Nowe logo Kierivo — wersja płaska (bez gradientu), jednobarwna.
    Stosowane przy druku jednofarbnym, na bladych tłach.
    Chevron tył: #155EEF, Chevron przód: #0C1828.
  -->

  <!-- Sygnet: chevron tył (niebieski) -->
  <path
    fill="#155EEF"
    d="M 28 10 L 10 40 L 28 70 L 40 70 L 22 40 L 40 10 Z"
  />

  <!-- Sygnet: chevron przód (granatowy) -->
  <path
    fill="#0C1828"
    d="M 48 10 L 30 40 L 48 70 L 60 70 L 42 40 L 60 10 Z"
  />

  <!-- Napis Kierivo — płaski -->
  <text
    x="80"
    y="55"
    fill="#0C1828"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="44"
    font-weight="700"
    letter-spacing="-1.5"
  >Kierivo</text>
</svg>
